name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - main # 或是 master，請依據您的預設分支名稱修改

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }} # GCP 專案 ID (需於 GitHub Secrets 設定)
  GAR_LOCATION: asia-east1 # Artifact Registry 區域 (可依需求調整，例如 asia-east1 台灣)
  SERVICE: fitness-plan-editor # Cloud Run 服務名稱
  REGION: asia-east1 # Cloud Run 部署區域 (例如 asia-east1 台灣)

jobs:
  deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. 登入 Google Cloud (使用 Service Account Key)
      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }} # Service Account 密鑰 JSON (需於 GitHub Secrets 設定)

      # 2. 設定 gcloud CLI
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 3. 設定 Docker 認證以登入 Artifact Registry
      - name: Configure Docker
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      # 4. 建立與推送 Docker 映像檔
      - name: Build and Push Container
        run: |
          # 檢查或建立 Artifact Registry 儲存庫 (如果不存在的話)
          gcloud artifacts repositories create run-images \
            --repository-format=docker \
            --location=${{ env.GAR_LOCATION }} \
            --description="Cloud Run Docker images" \
            --quiet || true
          
          IMAGE_TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/run-images/${{ env.SERVICE }}:${{ github.sha }}"
          
          # 建立 Docker 映像檔
          docker build -t $IMAGE_TAG .
          
          # 推送至 Artifact Registry
          docker push $IMAGE_TAG
          
          # 將映像檔路徑存入環境變數供下一步驟使用
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      # 5. 部署至 Google Cloud Run
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE_TAG }}
          flags: '--allow-unauthenticated --port=8080' # 允許公開存取並指定 Nginx 的 8080 埠口
